<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dips Editz — Offline</title>
  <meta name="theme-color" content="#07070d" />
  <style>
    :root { --bg:#07070d; --purple:#8b5cf6; --purple-3:#c084fc; --text:#f5f5fa; --muted:#8a8a9e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .card { max-width: 480px; padding: 40px 28px; border-radius: 24px; border: 1px solid rgba(139,92,246,0.35); background: #12121f; box-shadow: 0 20px 60px rgba(0,0,0,0.45); }
    h1 { font-size: 1.6rem; margin-bottom: 12px; }
    .grad { background: linear-gradient(135deg, #c084fc, #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: var(--muted); margin-bottom: 10px; line-height: 1.6; }
    a { color: var(--purple-3); font-weight: 600; }
    .btn { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 12px; background: linear-gradient(135deg, #8b5cf6, #a855f7); color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are <span class="grad">offline</span></h1>
    <p>The Dips Editz portfolio shell can load without an internet connection once it has been cached.</p>
    <p>YouTube videos, thumbnails, and the email booking workflow require an internet connection.</p>
    <p>Bookings are not submitted or saved while offline. Please reconnect and try again.</p>
    <a class="btn" href="./index.html">Try Again</a>
  </div>
</body>
</html>
